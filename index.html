<!doctype html><html lang="sw"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111"><link rel="manifest" href="manifest.json"><title>Bolt Driver</title><style>body{margin:0;font-family:Arial;background:#f4f4f4;color:#111}header{background:#111;color:#fff;padding:18px;font-size:22px;font-weight:bold}main{max-width:600px;margin:auto;padding:16px}.card{background:#fff;padding:18px;margin-bottom:14px;border-radius:16px;box-shadow:0 2px 10px #0001}input{width:100%;box-sizing:border-box;padding:13px;margin:6px 0 12px;border:1px solid #ddd;border-radius:10px}button{width:100%;padding:14px;margin-top:8px;border:0;border-radius:12px;background:#111;color:#fff;font-size:16px}</style></head><body><header>🚗 Bolt Driver</header><main><div class="card"><h2>Dashboard</h2><div id="status">Hujajaingia.</div><button onclick="login()">Ingia</button></div><div class="card"><h3>Safari</h3><label>Mahali pa kuchukua</label><input id="pickup" placeholder="Mfano: Posta"><label>Unapoenda</label><input id="destination" placeholder="Mfano: Mikocheni"><button onclick="requestRide()">Omba Safari</button></div><div class="card"><h3>Mapato</h3><p>Leo: <b>TZS 0</b></p></div></main><script>function login(){status.textContent='Umeingia kwenye dashboard.'}function requestRide(){let p=pickup.value,d=destination.value;if(!p||!d)return alert('Jaza sehemu zote mbili.');status.textContent='Safari: '+p+' → '+d}if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');</script></body></html>
